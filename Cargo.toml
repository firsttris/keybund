[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/firsttris/keybund"
rust-version = "1.80"

[workspace.dependencies]
keybund-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
