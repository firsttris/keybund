[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/firsttris/keybund"
rust-version = "1.89"

[workspace.dependencies]
keybund-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
