name: Release

# A tag vX.Y.Z (from the "Bump version" button or pushed from a checkout) runs the checks, builds the
# CLI binaries, the AppImage, the .deb and the macOS .dmg, and creates the GitHub release with these files.
# The checks are skipped when main's CI already passed for the code (a release commit from "Bump
# version" changes only versions), so the builds start right away.
# Run by hand on a branch it only checks and builds (no release), e.g. to try the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@ccr-161f105b-9ns022
    permissions:
      actions: read
      contents: read

  checks:
    needs: tested
    if: needs.tested.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build · CLI, AppImage, .deb
    needs: [tested, checks]
    # The checks either passed or were not needed
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    # Older glibc than the test runners, so the binaries also run on older distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri bundler)
        uses: firsttris/workflows/actions/apt-install@ccr-161f105b-9ns022
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
          recommends: "false"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: cargo build --release --locked -p keybund-cli
      - run: pnpm tauri build --bundles appimage,deb
        working-directory: app
      - name: Collect release files
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version *= *"' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          tar -czf "dist/keybund-cli-${version}-x86_64-linux.tar.gz" -C target/release keybund
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build · macOS CLI and .dmg (Apple Silicon + Intel)
    needs: [tested, checks]
    if: ${{ !cancelled() && needs.tested.result == 'success' && needs.checks.result != 'failure' }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: CLI for both architectures in one binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p keybund-cli --target aarch64-apple-darwin
          cargo build --release --locked -p keybund-cli --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/keybund \
            target/aarch64-apple-darwin/release/keybund target/x86_64-apple-darwin/release/keybund
      # Ad-hoc signed ("signingIdentity": "-" in tauri.conf.json), not notarized: Gatekeeper asks
      # once, see docs/installation.md.
      # app too: the dmg alone keeps no .app around for the smoke test below.
      - run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
        working-directory: app
      # Nobody has to find out on their Mac that the app does not start: both architectures are in
      # it, the CLI answers, and the app opens its window and keeps running (a throw-away HOME,
      # so the runner's own files stay untouched).
      - name: Smoke test · CLI and app start on macOS
        run: |
          set -euo pipefail
          app=$(find target/universal-apple-darwin/release/bundle -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "No .app in the bundle folder"; find target/universal-apple-darwin/release/bundle -maxdepth 2; exit 1; }
          bin=$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)
          for b in target/universal/keybund "$bin"; do
            archs=$(lipo -archs "$b")
            echo "$b: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          done
          home=$(mktemp -d)
          HOME="$home" target/universal/keybund --version
          HOME="$home" target/universal/keybund doctor || true
          HOME="$home" "$bin" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "The app exited during start:"; cat "$RUNNER_TEMP/app.log"; exit 1
          fi
          kill "$pid"
          ! grep -i "panicked" "$RUNNER_TEMP/app.log"
      - name: Collect release files
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version *= *"' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          tar -czf "dist/keybund-cli-${version}-universal-macos.tar.gz" -C target/universal keybund
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  collect:
    name: Collect · all files and checksums
    needs: [build, build-macos]
    # A skipped "checks" job further up would otherwise skip this job too
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum -- * > SHA256SUMS && ls -l)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: collect
    # run by hand on a branch: only checks and build
    if: ${{ !cancelled() && needs.collect.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      version-file: Cargo.toml
      release-artifact: dist
    permissions:
      contents: write
