[package]
name = "keybund-cli"
description = "keybund – SSH key manager for Linux: the right SSH key and Git identity per folder, account and server (command line)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "keybund"
path = "src/main.rs"

[dependencies]
keybund-core.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
console = "0.16"
anyhow = "1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
