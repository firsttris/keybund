name: Release

# A tag vX.Y.Z (from the "Bump version" button or pushed from a checkout) runs the checks, builds the
# CLI binary, the AppImage and the .deb, and creates the GitHub release with these files.
# Run by hand on a branch it only checks and builds (no release), e.g. to try the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build · CLI, AppImage, .deb
    needs: checks
    # Older glibc than the test runners, so the binaries also run on older distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Client IDs of Keybund's OAuth apps (public, not secrets) for the login
      # in the browser when adding keys to GitHub/GitLab. Repository
      # variables, see docs/oauth-apps.md; empty means: tokens only.
      KEYBUND_GITHUB_CLIENT_ID: ${{ vars.KEYBUND_GITHUB_CLIENT_ID }}
      KEYBUND_GITLAB_CLIENT_ID: ${{ vars.KEYBUND_GITLAB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri bundler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: cargo build --release --locked -p keybund-cli
      - run: pnpm tauri build --bundles appimage,deb
        working-directory: app
      - name: Collect release files
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version *= *"' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          tar -czf "dist/keybund-cli-${version}-x86_64-linux.tar.gz" -C target/release keybund
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # run by hand on a branch: only checks and build
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      version-file: Cargo.toml
      release-artifact: dist
    permissions:
      contents: write
