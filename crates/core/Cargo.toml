[package]
name = "keybund-core"
description = "Core library of Keybund, the SSH key manager: profiles, OpenSSH and Git config rendering, apply, doctor, connection tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Derives specta::Type for all public data types (used by the Tauri app).
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
specta = { workspace = true, optional = true }
toml = "0.9"
similar = "3"
sha2 = "0.11"
base64 = "0.23"
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# setsid for the connection test in the app (no terminal may be touched)
libc = "0.2"

[dev-dependencies]
insta = "1"
tempfile = "3"
