name: CI

on:
  push:
    branches: [main]            # not every branch, pull requests build through pull_request
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call:                # release.yml runs the same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust · fmt, clippy, unit + integration + E2E tests
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # From the Actions cache: the Ubuntu mirror is sometimes slow, the install took up to a minute
      - name: System packages (Tauri, ssh, git)
        uses: firsttris/workflows/actions/apt-install@ccr-161f105b-9ns022
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
            openssh-client openssh-server git
          recommends: "false"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Includes the bindings check: fails if app/src/lib/bindings.ts is outdated.
      - run: cargo test --workspace

  rust-macos:
    name: Rust · macOS · clippy, unit + integration + E2E tests
    # The same tests against Apple's ssh and git: Keychain options, gitdir/i, launchd's agent.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The runner puts Homebrew first; a Mac out of the box has Apple's ssh and git
      # (/usr/bin, Xcode Command Line Tools). Test against those.
      - name: Apple's ssh and git first on PATH
        run: |
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          which -a ssh git | head -4
          ssh -V
          git --version
          test "$(command -v ssh)" = /usr/bin/ssh && test "$(command -v git)" = /usr/bin/git
      - run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace

  rust-coverage:
    name: Rust · coverage
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri, ssh, git)
        uses: firsttris/workflows/actions/apt-install@ccr-161f105b-9ns022
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
            openssh-client openssh-server git
          recommends: "false"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - name: Coverage (core and CLI must stay above 85% of lines)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --package keybund-core --package keybund-cli --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  frontend:
    name: Frontend · lint, typecheck, unit + component tests, build
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: app/coverage
          if-no-files-found: ignore

  playwright-image:
    name: Frontend · Playwright image
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - id: version
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: app/pnpm-lock.yaml

  e2e:
    name: Frontend · Playwright E2E
    needs: playwright-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The official image of the @playwright/test version in the lockfile: browsers, their libraries
    # and fonts are in it, so no playwright install runs and every run sees the same browser.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      # Node comes with the image; this only caches the pnpm store.
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
