name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust · fmt, clippy, unit + integration + E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri, ssh, git)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            openssh-client git
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Includes the bindings check: fails if app/src/lib/bindings.ts is outdated.
      - run: cargo test --workspace

  rust-coverage:
    name: Rust · coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev openssh-client git
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - name: Coverage (core and CLI must stay above 85% of lines)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --package keybund-core --package keybund-cli --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  frontend:
    name: Frontend · lint, typecheck, unit + component tests, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: app/coverage
          if-no-files-found: ignore

  e2e:
    name: Frontend · Playwright E2E
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results

  bundle:
    name: Release build · CLI binary + AppImage
    needs: [rust, frontend, e2e]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: cargo build --release -p keybund-cli
      - run: pnpm tauri build --bundles appimage
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: keybund-linux-x86_64
          path: |
            target/release/keybund
            target/release/bundle/appimage/*.AppImage
